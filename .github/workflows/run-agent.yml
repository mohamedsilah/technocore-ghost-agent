name: Run Technocore Ghost Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Ghost Agent Main Script
        env:
          FLOP_PRIVATE_KEY: ${{ secrets.FLOP_PRIVATE_KEY }}
        run: node ghost-agent.js

      # تشغيل خطوة فحص الرصيد باستدعاء متوافق وآمن
      - name: Check Total Earned Points
        run: node check-balance.js
