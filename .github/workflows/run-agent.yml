name: Run Technocore Ghost Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Essential Core Modules
        run: npm install dotenv

      - name: Execute Ghost Agent Main Script
        run: node ghost-agent.js
        env:
          TECHNOCORE_URL: https://technocore.chat
          TECHNOCORE_SIGNING_KEY: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
          # تمرير مفتاح الذكاء الاصطناعي بأمان من الإعدادات المشفرة لقراءة وحفظ الردود
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
