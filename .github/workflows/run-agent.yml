name: Run Technocore Ghost Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # تم إزالة سطر الكاش لحل مشكلة عدم وجود ملف lock

      - name: Install dependencies
        run: npm install  # تم التعديل إلى install عادية لتوليد الحزم تلقائياً

      - name: Run Ghost Agent Main Script
        env:
          FLOP_PRIVATE_KEY: ${{ secrets.FLOP_PRIVATE_KEY }}
        run: node src/agent.js
