name: Run Advanced FLOP Miner (Script 2 Optimization)

on:
  push:
    branches: [ main ]
  schedule:
    # تم تغيير الجدولة لتعمل في أوقات متفرقة وعشوائية من اليوم لكسر النمط الآلي الثابت ومحاكاة النشاط البشري
    - cron: '23 2,6,11,15,18,22 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي دائماً متى أردت زيادة نقاطك بنفسك

jobs:
  run-advanced-miner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Project Dependencies
      run: |
        npm install

    - name: Execute Production Node V5
      env:
        TECHNOCORE_URL: "https://technocore.chat"
        MY_SECRET_SEED: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
      run: |
        npm start
