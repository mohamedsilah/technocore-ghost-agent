name: Run Advanced FLOP Miner (Script 2 Optimization)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  run-advanced-miner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Project Dependencies
      run: |
        npm install
        npm install dotenv

    - name: Force Script 2 H100 Compliance & Stealth Cooling
      env:
        TECHNOCORE_URL: "https://technocore.chat"
        TECHNOCORE_SIGNING_KEY: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
        # فرض تفعيل وضع مالك العقدة الرسمي باللغة الإنجليزية وعقود الـ H100
        NODE_ENV: "production"
        MINER_TARGET: "H100"
      run: |
        echo "Forcing Official FLOP.FINANCE Live Report & Compliance Metrics..."
        # تشغيل ملف إعدادات التكوين والربط المتقدم لتأمين العقود المتتالية
        node config.js && node tclk-core.js
