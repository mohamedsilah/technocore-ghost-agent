name: Run Advanced FLOP Miner (Script 2 Optimization)

on:
  push:
    branches: [ main ]
  schedule:
    # تشغيل تلقائي كل ساعة للحفاظ على استمرار العقدة في جلب أرباح الـ H100
    - cron: '0 * * * *'
  workflow_dispatch: # زر التشغيل اليدوي المباشر

jobs:
  run-advanced-miner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # تم إزالة سطر الكاش لحل مشكلة توقف السكربت نهائياً

    - name: Install Project Dependencies
      run: |
        npm install
        npm install dotenv

    - name: Execute Script 2 Layer (Advanced Mining & Contract Sync)
      env:
        TECHNOCORE_URL: "https://technocore.chat"
        TECHNOCORE_SIGNING_KEY: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
      run: |
        echo "Initializing Advanced Node Execution with Stealth Cooling..."
        npm start
